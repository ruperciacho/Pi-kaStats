name: Aktualizacja danych

on:
  schedule:
    - cron: '37 5 * * *'   # codziennie 7:37 latem / 6:37 zimą (czas polski)
  workflow_dispatch:       # ręczne uruchomienie z zakładki Actions (opcjonalnie)

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pobierz dane i zbuduj stronę
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/build.py

      - name: Zapisz pobrane mecze pucharowe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Dane pucharowe $(date -u +%F)"
            git push
          fi

      - name: Opublikuj stronę (gałąź gh-pages)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Strona $(date -u +'%F %H:%M')"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
